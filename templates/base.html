<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Congreso 2026</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <style>
        header {
            height: 100px;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        header img {
            width: 50px;
            height: 50px;
        }
        header nav a {
            text-decoration: none;
            font-weight: normal;
            color: darkgreen;
            margin-left: 20px;
        }
        header nav a:hover {
            font-weight: bold;
        }
    </style>
    <header>
        <img src="" alt="">
        <nav>
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'about' %}">About</a>
            <a href="{% url 'contact' %}">Contact</a>
            <a href="{% url 'workshop:list' %}">Talleres</a>
        </nav>
    </header>
    {% block content %}
    {% endblock %}
</body>
</html>
