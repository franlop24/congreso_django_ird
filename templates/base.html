<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Congreso 2026</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <header>
        <img src="{% static 'images/logoitiid.png' %}" alt="">
        <nav>
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'about' %}">About</a>
            <a href="{% url 'workshops:list' %}">Talleres</a>
            {% if user.is_authenticated %}
                <form action="{% url 'logout' %}" method="post" style="display: inline-block;">
                {% csrf_token %}
                <button class="btn sm" type="submit">Salir</button>
                </form>
            {% else %}
                <a href="">Registro</a>
                <a href="{% url 'login' %}">Login</a>
            {% endif %}
        </nav>
    </header>
    <div class="container">
    {% block content %}
    {% endblock %}
    </div>
</body>
</html>
