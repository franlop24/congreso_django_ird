{% extends 'base.html' %}

{% block content %}
<h1>Talleres Congreso 2026</h1>
<div class="container-workshop">
    {% for w in workshops %}
    <div class="card">
        {% if w.image %}
        <div class="card-header" style="background-image: url('{{ w.image.url }}');">
        {% else %}
        <div class="card-header">
        {% endif %}
            <h2>{{ w.name }}</h2>
        </div>
        <div class="card-body">
            <p>{{ w.description }}</p>
            <p>{{ w.classroom }}</p>
            <p>{{ w.date }} - {{ w.start }}</p>
            <a class="btn" href="{% url 'workshops:details' w.id %}">Ver detalles</a>
        </div>
    </div>
    {% endfor %}
</div>

{% endblock %}
